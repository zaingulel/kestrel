{
  "context.properties": {
    "log.level": 2
  },
  "context.spa-libs": {
    "audio.convert.*": "audioconvert/libspa-audioconvert",
    "support.*": "support/libspa-support"
  },
  "context.modules": [
    { "name": "libpipewire-module-rt", "flags": ["ifexists", "nofail"] },
    { "name": "libpipewire-module-protocol-native" },
    { "name": "libpipewire-module-client-node" },
    { "name": "libpipewire-module-adapter" },
    {
      "name": "libpipewire-module-echo-cancel",
      "args": {
        "monitor.mode": true,
        "capture.props": {
          "node.name": "kestrel-echo-removal-capture"
        },
        "source.props": {
          "node.name": "kestrel-microphone",
          "node.description": "Kestrel microphone (echo removed)"
        },
        "sink.props": {
          "node.name": "kestrel-echo-removal-reference"
        }
      }
    }
  ]
}
