# This tracked guard starts on pull-request events. Its one job judges a documentation-sweep or
# day-after triage branch against the scope rules in docs/DOC-SWEEP.md and is skipped on every other
# branch. Committing this file does not establish a required check or activate the maintenance
# routine, its schedule, or its publication environment.
#
# pull_request_target keeps the workflow file, check script, and library on `main`, never the pull
# request it judges. The packages the check parses Markdown with are installed from the base tree's
# own lock; the pull request's commits are read as git objects and nothing from its tree is executed.
# Only a sweep or triage branch reaches the install, so only those pull requests depend on
# registry.npmjs.org, and an outage fails this check closed until someone re-runs it.
name: sweep-scope

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: sweep-scope-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sweep-scope:
    # The branch is decided here and nowhere else: no step carries a condition, so a job that starts
    # always judges. A job this condition skips starts no runner and still reports its required
    # check as passing; a workflow-level filter is what would leave a required check pending for
    # ever. A fork names its own branch, which this expression compares as a value and no script
    # reads. `startsWith` ignores letter case, so a prefix in other casing is judged too.
    if: startsWith(github.head_ref, 'docs-sweep/') || startsWith(github.head_ref, 'docs-triage/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No `ref`: on pull_request_target the checkout is the base branch, which is the point.
      # fetch-depth 0 brings every branch head, so the pull request's commits are present as objects.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "sweep-scope: head $HEAD_SHA was not fetched; a later push re-runs this check" >&2
            exit 1
          fi
          node scripts/sweep-scope-check.mjs "$BASE_SHA" "$HEAD_SHA"
